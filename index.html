    <!-- JSON-LD Structured Data - FAQPage (GEO) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Munal AI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Munal AI is an enterprise-grade, AI-powered workforce management and collaboration platform that replaces multiple workplace tools with a single integrated system. It includes AI meeting transcription and summaries, smart shift scheduling, eSignatures with multi-step approvals, centralized document management (DocHub), text-to-video and text-to-audio generation, real-time chat and video conferencing, and enterprise AES-256 encryption."
          }
        },
        {
          "@type": "Question",
          "name": "How does Munal AI help with clinical and administrative leadership alignment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Munal AI automatically transcribes and summarizes meetings using GPT-5.2, extracting action items, decisions, and follow-ups. Clinical directors and administrative leaders can receive formatted meeting summaries via email, ensuring alignment on priorities and next steps without manual note-taking."
          }
        },
        {
          "@type": "Question",
          "name": "Does Munal AI offer smart shift management for medical staff?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Munal AI provides a visual drag-and-drop shift scheduler with day, week, and month views. You can schedule nurses, doctors, and support staff across 24/7 rotations with automated reminders, shift swap requests with manager approvals, and real-time coverage tracking."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use eSignatures for patient intake and compliance forms?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely. Munal AI supports legally binding digital eSignatures with full audit trails. Multi-step approval workflows route patient intake forms, consent documents, and compliance paperwork through the appropriate clinical and administrative reviewers."
          }
        },
        {
          "@type": "Question",
          "name": "What is DocHub in Munal AI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "DocHub is Munal AI's centralized document management system. It provides secure, encrypted storage for medical records, strategy documents, and compliance files with PDF editing, file conversion, version control, full-text search, and granular access permissions."
          }
        },
        {
          "@type": "Question",
          "name": "Can Munal AI create training videos for staff?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Munal AI includes AI-powered text-to-video (Sora 2) and text-to-audio generation. You can create quick internal staff training videos, health announcements, onboarding materials, and patient education content from simple text prompts."
          }
        },
        {
          "@type": "Question",
          "name": "What security does Munal AI provide?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Munal AI uses AES-256 encryption for data at rest and in transit, two-factor authentication (TOTP and email OTP), role-based access control (RBAC) with granular permissions, comprehensive audit logging, and compliance reporting. It is designed for enterprise environments including healthcare, legal, and financial services."
          }
        },
        {
          "@type": "Question",
          "name": "What industries does Munal AI serve?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Munal AI serves healthcare (clinical leadership alignment, medical staff scheduling, patient intake), education (faculty meetings, academic scheduling, enrollment), legal (client meeting transcription, contract eSignatures, case management), and finance (compliance documentation, branch operations scheduling, audit trails)."
          }
        }
      ]
    }
